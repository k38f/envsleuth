[build-system]
requires = ["setuptools~=80.9.0", "wheel~=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envsleuth"
version = "0.3.1"
description = "Detective for env vars in Python code. Parses your source with AST, finds every os.getenv/os.environ usage, and tells you what's missing from your .env file."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "k38f" },
]
keywords = ["env", "dotenv", "cli", "static-analysis", "ast", "environment-variables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "click~=8.1.8",
    "python-dotenv~=1.2.1",
    "flashbar~=1.3.0",
    "packaging~=26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.4.2",
    "pytest-cov~=7.1.0",
]

[project.scripts]
envsleuth = "envsleuth.cli:cli"

[project.urls]
Homepage = "https://github.com/k38f/envsleuth"
Repository = "https://github.com/k38f/envsleuth"
Issues = "https://github.com/k38f/envsleuth/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["envsleuth*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
