[build-system]
requires = ["setuptools~=83.0.0", "wheel~=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envsleuth"
version = "1.0.0"
description = "Static environment-variable analysis for Python projects, with .env checks, pydantic-settings support, CI policies, and SARIF output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "k38f" },
]
keywords = ["env", "dotenv", "cli", "static-analysis", "ast", "environment-variables"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "click~=8.4.2",
    "python-dotenv~=1.2.2",
    "flashbar~=1.3.0",
    "packaging~=26.2.0",
    "tomli~=2.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
]

[project.scripts]
envsleuth = "envsleuth.cli:cli"

[project.urls]
Homepage = "https://github.com/k38f/envsleuth"
Repository = "https://github.com/k38f/envsleuth"
Issues = "https://github.com/k38f/envsleuth/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["envsleuth*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
